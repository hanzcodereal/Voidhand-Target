name: voidhand_target
description: Voidhand.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  url_launcher: ^6.3.0
  permission_handler: ^11.3.1
  font_awesome_flutter: 10.9.0
  flutter_contacts: ^1.1.9
  geolocator: ^13.0.1
  device_info_plus: ^10.1.2
  battery_plus: ^6.0.2
  camera: ^0.11.0+2
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/lock.mp3
  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/Rajdhani-Regular.ttf
